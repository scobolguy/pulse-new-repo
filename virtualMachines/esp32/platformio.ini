; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 9600
lib_deps =
	ESP Async WebServer
	me-no-dev/AsyncTCP
	bblanchon/ArduinoJson
	adafruit/DHT sensor library
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BME280 Library
 	adafruit/Adafruit BMP280 Library
	
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
lib_ignore = AsyncTCP_RP2040W
build_flags = -std=gnu++17 -DENABLE_PMACHINE

[env:esp32_bonecrusher]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 9600
lib_deps =
	ESP Async WebServer
	me-no-dev/AsyncTCP
	bblanchon/ArduinoJson
	adafruit/DHT sensor library
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BME280 Library
	adafruit/Adafruit BMP280 Library
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
lib_ignore = AsyncTCP_RP2040W
build_flags =
	-std=gnu++17
	-DENABLE_PMACHINE
	-DDEVICE_ROLE=\"bonecrusher\"
	-DPROFILE_MAX_MESSAGE_BYTES=65536
	-DPROFILE_MAX_CONCURRENT_TASKS=1
	-DPROFILE_PREFERRED_TASK_TYPE=\"large-message-transform\"
	-DFIRMWARE_TRACK=\"stable\"

[env:esp32_drone]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 9600
lib_deps =
	ESP Async WebServer
	me-no-dev/AsyncTCP
	bblanchon/ArduinoJson
	adafruit/DHT sensor library
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BME280 Library
	adafruit/Adafruit BMP280 Library
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
lib_ignore = AsyncTCP_RP2040W
build_flags =
	-std=gnu++17
	-DENABLE_PMACHINE
	-DDEVICE_ROLE=\"drone\"
	-DPROFILE_MAX_MESSAGE_BYTES=8192
	-DPROFILE_MAX_CONCURRENT_TASKS=4
	-DPROFILE_PREFERRED_TASK_TYPE=\"microtask-batch\"
	-DFIRMWARE_TRACK=\"canary\"

[env:esp32_supervisor_guard]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 9600
lib_deps =
	ESP Async WebServer
	me-no-dev/AsyncTCP
	bblanchon/ArduinoJson
	adafruit/DHT sensor library
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BME280 Library
	adafruit/Adafruit BMP280 Library
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
lib_ignore = AsyncTCP_RP2040W
build_flags =
	-std=gnu++17
	-DENABLE_PMACHINE
	-DDEVICE_ROLE=\"sentinel\"
	-DPROFILE_MAX_MESSAGE_BYTES=4096
	-DPROFILE_MAX_CONCURRENT_TASKS=1
	-DPROFILE_PREFERRED_TASK_TYPE=\"stability-supervisor\"
	-DFIRMWARE_TRACK=\"ops\"
	-DSUPERVISOR_DEFAULT_ENABLED=1
	-DSUPERVISOR_REQUIRE_FRONTEND=1
	-DSUPERVISOR_CHECK_INTERVAL_MS=5000
	-DSUPERVISOR_BACKEND_URL=\"http://192.168.2.11:4000/status\"
	-DSUPERVISOR_FRONTEND_URL=\"http://192.168.2.11:5173/\"
	-DSUPERVISOR_HEARTBEAT_URL=\"http://192.168.2.11:4000/api/supervisor/heartbeat\"

[env:esp32dev_ota]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = espota
upload_port = 192.168.2.115
upload_flags =
	--host_ip=192.168.2.11
	--host_port=3233
	--timeout=30
monitor_speed = 9600
lib_deps =
	ESP Async WebServer
	me-no-dev/AsyncTCP
	bblanchon/ArduinoJson
	adafruit/DHT sensor library
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BME280 Library
	adafruit/Adafruit BMP280 Library
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
lib_ignore = AsyncTCP_RP2040W
build_flags = -std=gnu++17 -DENABLE_PMACHINE

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps =
	ESP Async WebServer
	me-no-dev/ESPAsyncTCP
	bblanchon/ArduinoJson
board_build.filesystem = littlefs
build_flags = -std=gnu++17 -DENABLE_PMACHINE
lib_ignore = AsyncTCP, AsyncTCP_RP2040W
