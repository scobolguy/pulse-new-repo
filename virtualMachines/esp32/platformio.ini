; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
build_flags =
	-DENABLE_TIME_AUTHORITY
	-DTIME_AUTHORITY_COOP_ENABLED=1
	-Wno-deprecated-declarations

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps = 
	ESP Async WebServer
	me-no-dev/AsyncTCP
	bblanchon/ArduinoJson
	adafruit/DHT sensor library
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BME280 Library
	adafruit/Adafruit BMP280 Library
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
lib_ignore = AsyncTCP_RP2040W
build_flags =
	${env.build_flags}
	-std=gnu++17
	-DENABLE_PMACHINE
	-DPLATFORM_ESP
build_src_filter = +<*> -<pmachine_dynamic_library_test.cpp> -<pmachine_scheduler_test.cpp> -<aws_iot_client.cpp> -<aws_iot_routes.cpp> -<alexa_handlers.cpp> -<printer_alexa_handlers.cpp> -<wfl_handlers.cpp>

[env:esp32_bonecrusher]
