name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-quality:
    name: Offline Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            aggregator/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Aggregator dependencies
        run: npm --prefix aggregator ci

      - name: Verify workspace boundaries
        run: npm run test:layout

      - name: Verify editor conventions
        run: npm run test:editorconfig

      - name: Verify Aggregator module boundaries
        run: npm run test:aggregator:modules

      - name: Verify runtime-data policy
        run: npm run test:runtime-data-policy

      - name: Verify JavaScript PMachine package
        run: npm run test:pmachine:javascript-package

      - name: Run JavaScript PMachine suite
        run: npm run test:pmachine:javascript

      - name: Verify Arduino PMachine migration contract
        run: npm run test:pmachine:arduino-layout

  firmware-build:
    name: ESP32 Firmware Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio_*.ini') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build PMachine-enabled ESP32 firmware
        run: platformio run -e esp32dev