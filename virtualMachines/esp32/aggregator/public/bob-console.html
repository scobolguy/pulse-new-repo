<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOB Console – Ollama Voice, Upload, Reset, Camera/Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #f7f8fa;
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  #header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px 8px;
    border-bottom: 1px solid #e5e7eb;
    background: #ffffff;
  }
  #header h1 {
    font-size: 15px;
    font-weight: 600;
    color: #1f2328;
    margin: 0;
    letter-spacing: .3px;
  }
  #statusDot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #57606a;
    flex-shrink: 0;
    transition: background .3s;
  }
  #statusDot.listening { background: #e36209; }
  #statusDot.busy      { background: #3b82d4; }
  #statusDot.ok        { background: #2da44e; }
  #statusLabel {
    font-size: 11px;
    color: #57606a;
    margin-left: -6px;
  }

  /* ── Main layout ── */
  #container {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 10px 14px 12px;
    gap: 8px;
    min-height: 0;
  }

  /* ── Output pane ── */
  #outputPane {
    flex: 1;
    font-size: 13px;
    line-height: 1.6;
    padding: 12px 14px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    overflow-y: auto;
    background: #ffffff;
    color: #1f2328;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 0;
  }
  #outputPane.html-mode {
    white-space: normal;
  }
  #outputPane .placeholder {
    color: #57606a;
    font-style: italic;
  }

  /* ── Spinner ── */
  #spinnerPane {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: #57606a;
  }
  #spinnerPane.visible { display: flex; }
  @keyframes bob-spin {
    to { transform: rotate(360deg); }
  }
  .spinner-ring {
    width: 18px;
    height: 18px;
    border: 2px solid #e5e7eb;
    border-top-color: #3b82d4;
    border-radius: 50%;
    animation: bob-spin .7s linear infinite;
    flex-shrink: 0;
  }

  /* ── Feedback bar ── */
  #feedbackBar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: #f7f8fa;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    font-size: 12px;
    color: #57606a;
    flex-wrap: wrap;
  }
  #feedbackBar.visible  { display: flex; }
  #feedbackBar.fallback { background: #fff8e1; border-color: #f0c040; }
  .fb-btn {
    padding: 3px 10px;
    font-size: 13px;
    border-radius: 5px;
    border: 1px solid #e5e7eb;
    background: #fff;
    cursor: pointer;
    line-height: 1.4;
    font-family: inherit;
  }
  .fb-btn:hover { background: #f0f0f0; }
  .fb-btn.good  { border-color: #2da44e; color: #2da44e; }
  .fb-btn.bad   { border-color: #cf222e; color: #cf222e; }
  #feedbackExpected {
    display: none;
    gap: 6px;
    align-items: center;
    width: 100%;
    margin-top: 4px;
  }
  #feedbackExpected.visible { display: flex; }
  #feedbackExpectedInput {
    flex: 1;
    font-size: 12px;
    font-family: inherit;
    padding: 4px 8px;
    border: 1px solid #e5e7eb;
    border-radius: 5px;
    outline: none;
  }
  #feedbackExpectedInput:focus { border-color: #3b82d4; }
  #feedbackSubmitBtn {
    padding: 4px 12px;
    font-size: 12px;
    font-family: inherit;
    border-radius: 5px;
    border: 1px solid #3b82d4;
    background: #3b82d4;
    color: #fff;
    cursor: pointer;
  }
  #feedbackNote {
    font-size: 11px;
    color: #57606a;
    font-style: italic;
  }

  /* ── Controls row ── */
  #controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  button {
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    font-weight: 500;
    transition: filter .15s, opacity .15s;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button:not(:disabled):hover { filter: brightness(.93); }

  #talkBtn  { background: #0078d4; color: #fff; border-color: #0063b1; }
  #talkBtn.active { background: #e36209; border-color: #b74b00; }
  #sendBtn  { background: #2da44e; color: #fff; border-color: #228f3e; }
  #resetBtn { background: #cf222e; color: #fff; border-color: #a10e1a; }
  #correctionsBtn { background: #f7f8fa; color: #57606a; border-color: #d0d7de; }
  #correctionsBtn.pending { background: #bf8700; color: #fff; border-color: #9a6700; }

  /* file upload styled */
  #uploadWrapper {
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  #uploadLabel {
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    border-radius: 6px;
    border: 1px solid #e5e7eb;
    background: #f7f8fa;
    color: #1f2328;
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
  }
  #uploadLabel:hover { filter: brightness(.95); }
  #uploadInput { display: none; }
  #fileCount {
    font-size: 11px;
    color: #57606a;
    margin-left: 4px;
  }

  /* ── Query textarea ── */
  #queryBox {
    width: 100%;
    height: 80px;
    font-size: 13px;
    font-family: inherit;
    line-height: 1.5;
    padding: 10px 12px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    resize: vertical;
    background: #ffffff;
    color: #1f2328;
    outline: none;
    transition: border-color .15s;
  }
  #queryBox:focus { border-color: #3b82d4; }
</style>
</head>
<body>

<div id="header">
  <div id="statusDot"></div>
  <h1>BOB Console</h1>
  <span id="statusLabel">idle</span>
</div>

<div id="container">

  <div id="outputPane">
    <span class="placeholder">Model replies, camera feeds, and dashboards will appear here.</span>
  </div>

  <div id="spinnerPane">
    <div class="spinner-ring"></div>
    <span id="spinnerLabel">Thinking…</span>
  </div>

  <!-- ── Feedback bar ── -->
  <div id="feedbackBar">
    <span>Was this correct?</span>
    <button class="fb-btn good" id="fbGood">&#128077; Yes</button>
    <button class="fb-btn bad"  id="fbBad">&#128078; No</button>
    <span id="feedbackNote"></span>
    <div id="feedbackExpected">
      <input id="feedbackExpectedInput" type="text" placeholder="What did you expect instead?">
      <button id="feedbackSubmitBtn">Submit</button>
    </div>
  </div>

  <div id="controls">
    <button id="talkBtn">&#127908; Push to Talk</button>
    <button id="sendBtn">Send</button>
    <button id="resetBtn">Reset Model</button>
    <button id="correctionsBtn" disabled>Run Corrections (0)</button>
    <div id="uploadWrapper">
      <label id="uploadLabel" for="uploadInput">&#128206; Attach Files</label>
      <input type="file" id="uploadInput" multiple>
      <span id="fileCount"></span>
    </div>
  </div>

  <textarea id="queryBox" placeholder="Type your query here… (Enter to send, Shift+Enter for new line)"></textarea>

</div>

<script>
/* ─────────────────────────────────────────────────────────
   CONFIG
───────────────────────────────────────────────────────── */
const MCP_QUERY_URL = '/mcp-query';
const MAPL_STREAM_URL = '/api/mapper/authoring/ollama-intent-stream';
const MAPL_TEST_STREAM_URL = '/api/mapper/authoring/test-last-stream';
const FEEDBACK_URL = '/api/agent/feedback';
const CORRECTIONS_URL = '/api/agent/corrections';

/* ─────────────────────────────────────────────────────────
   STATUS INDICATOR
───────────────────────────────────────────────────────── */
const dot   = document.getElementById('statusDot');
const label = document.getElementById('statusLabel');

function setStatus(state, text) {
  dot.className = state;
  label.textContent = text;
}

/* ─────────────────────────────────────────────────────────
   FEEDBACK
───────────────────────────────────────────────────────── */
let currentInteractionId = null;
let currentIntentId      = null;
let feedbackSubmitting   = false;

function showFeedbackBar(interactionId, intentId, needsClarification = false) {
  currentInteractionId = interactionId;
  currentIntentId      = intentId;

  const bar      = document.getElementById('feedbackBar');
  const note     = document.getElementById('feedbackNote');
  const expected = document.getElementById('feedbackExpected');
  const input    = document.getElementById('feedbackExpectedInput');
  const prompt   = document.querySelector('#feedbackBar > span:first-child');
  const fbGood   = document.getElementById('fbGood');
  const fbBad    = document.getElementById('fbBad');

  input.value = '';
  feedbackSubmitting = false;
  fbGood.disabled = false;
  fbBad.disabled = false;
  document.getElementById('feedbackSubmitBtn').disabled = false;
  bar.classList.add('visible');

  if (needsClarification || intentId === 'ollama-fallback') {
    // Ollama didn't understand — skip the Yes/No choice, go straight to "what did you expect?"
    bar.classList.add('fallback');
    prompt.textContent = "I wasn't sure what you meant — what were you expecting?";
    note.textContent   = '';
    fbGood.style.display = 'none';
    fbBad.style.display  = 'none';
    expected.classList.add('visible');
    setTimeout(() => input.focus(), 50);
  } else {
    bar.classList.remove('fallback');
    prompt.textContent   = 'Was this correct?';
    note.textContent     = intentId ? `intent: ${intentId}` : '';
    fbGood.style.display = '';
    fbBad.style.display  = '';
    expected.classList.remove('visible');
  }
}

function hideFeedbackBar() {
  document.getElementById('feedbackBar').classList.remove('visible');
  document.getElementById('feedbackExpected').classList.remove('visible');
  currentInteractionId = null;
  currentIntentId      = null;
}

async function submitFeedback(rating, expected) {
  if (!currentInteractionId || feedbackSubmitting) return false;
  feedbackSubmitting = true;
  const fbGood = document.getElementById('fbGood');
  const fbBad = document.getElementById('fbBad');
  const submitBtn = document.getElementById('feedbackSubmitBtn');
  fbGood.disabled = true;
  fbBad.disabled = true;
  submitBtn.disabled = true;
  try {
    const response = await fetch(FEEDBACK_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ interactionId: currentInteractionId, rating, expected: expected || null })
    });
    if (!response.ok) throw new Error(`Feedback request failed (${response.status})`);
    const data = await response.json();
    updateCorrectionButton(data.pendingCount);
    return data;
  } catch (e) {
    console.warn('Feedback submit failed:', e.message);
    fbGood.disabled = false;
    fbBad.disabled = false;
    submitBtn.disabled = false;
    return false;
  } finally {
    feedbackSubmitting = false;
  }
}

document.getElementById('fbGood').addEventListener('click', async () => {
  if (!await submitFeedback('good')) return;
  const note = document.getElementById('feedbackNote');
  note.textContent = '✓ Recorded — thank you';
  document.getElementById('feedbackExpected').classList.remove('visible');
  setTimeout(hideFeedbackBar, 1800);
});

document.getElementById('fbBad').addEventListener('click', () => {
  document.getElementById('feedbackExpected').classList.add('visible');
  document.getElementById('feedbackExpectedInput').focus();
});

document.getElementById('feedbackSubmitBtn').addEventListener('click', async () => {
  const expected = document.getElementById('feedbackExpectedInput').value.trim();
  if (!await submitFeedback('bad', expected)) return;
  const prompt = document.querySelector('#feedbackBar > span:first-child');
  const note   = document.getElementById('feedbackNote');
  prompt.textContent = '✓ Recorded — thank you';
  note.textContent   = '';
  document.getElementById('feedbackExpected').classList.remove('visible');
  setTimeout(hideFeedbackBar, 1800);
});

document.getElementById('feedbackExpectedInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('feedbackSubmitBtn').click();
});

/* ─────────────────────────────────────────────────────────
   NLI CORRECTIONS
───────────────────────────────────────────────────────── */
let correctionRunActive = false;

function updateCorrectionButton(pendingCount) {
  const count = Math.max(0, Number(pendingCount) || 0);
  const button = document.getElementById('correctionsBtn');
  button.textContent = `Run Corrections (${count})`;
  button.disabled = correctionRunActive || count === 0;
  button.classList.toggle('pending', count > 0);
}

async function refreshCorrectionStatus() {
  try {
    const response = await fetch(CORRECTIONS_URL, { cache: 'no-store' });
    if (!response.ok) throw new Error(`Correction status failed (${response.status})`);
    const data = await response.json();
    updateCorrectionButton(data.pendingCount);
  } catch (e) {
    console.warn('Correction status failed:', e.message);
    updateCorrectionButton(0);
  }
}

async function runCorrections() {
  if (correctionRunActive) return;
  correctionRunActive = true;
  const button = document.getElementById('correctionsBtn');
  button.disabled = true;
  setStatus('busy', 'applying corrections...');
  try {
    const response = await fetch(`${CORRECTIONS_URL}/run`, { method: 'POST' });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `Correction run failed (${response.status})`);
    renderOutput(`Applied ${data.appliedCount} NLI correction${data.appliedCount === 1 ? '' : 's'}.`);
    updateCorrectionButton(data.pendingCount);
    setStatus('ok', 'corrections applied');
  } catch (e) {
    renderOutput(`Correction error: ${e.message}`);
    setStatus('', 'error');
  } finally {
    correctionRunActive = false;
    await refreshCorrectionStatus();
  }
}

/* ─────────────────────────────────────────────────────────
   RENDER OUTPUT
───────────────────────────────────────────────────────── */
function showSpinner(msg) {
  document.getElementById('outputPane').style.display    = 'none';
  document.getElementById('spinnerLabel').textContent    = msg || 'Thinking…';
  document.getElementById('spinnerPane').classList.add('visible');
}

function hideSpinner() {
  document.getElementById('spinnerPane').classList.remove('visible');
  document.getElementById('outputPane').style.display = '';
}

function renderOutput(content) {
  hideSpinner();
  const pane = document.getElementById('outputPane');
  const trimmed = (content || '').trim();

  if (trimmed.startsWith('<')) {
    pane.classList.add('html-mode');
    pane.innerHTML = trimmed;
  } else {
    pane.classList.remove('html-mode');
    pane.textContent = trimmed;
  }

  pane.scrollTop = pane.scrollHeight;
}

function renderMappingProgress(messages) {
  const pane = document.getElementById('outputPane');
  pane.style.display = '';
  pane.classList.remove('html-mode');
  pane.textContent = messages.map((message, index) => `${index === messages.length - 1 ? 'Working' : 'Done'}: ${message}`).join('\n');
  document.getElementById('spinnerLabel').textContent = messages[messages.length - 1] || 'Generating MAPL';
  document.getElementById('spinnerPane').classList.add('visible');
  pane.scrollTop = pane.scrollHeight;
}

function isMappingAuthoringQuery(text) {
  return /\b(?:create|generate|build|write|make|compile)\b[\s\S]{0,120}\bmapl\b/i.test(text)
    || /\bmapl\b[\s\S]{0,120}\b(?:create|generate|build|write|make|compile)\b/i.test(text)
    || /\b(?:convert|map|transform)\b[\s\S]{1,80}\b(?:to|into)\b[\s\S]{0,80}\b(?:message|mt\d{3}|camt|pacs|pain)\b/i.test(text);
}

function isMappingTestQuery(text) {
  return /\btest\b[\s\S]{0,80}\b(?:map|mapping)\b/i.test(text)
    || /\b(?:map|mapping)\b[\s\S]{0,80}\btest\b/i.test(text);
}

async function readMaplStream(response, progressLabel) {
  if (!response.ok || !response.body) {
    throw new Error(`${progressLabel} failed (${response.status})`);
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  const progress = [];
  let buffer = '';
  let result = null;
  while (true) {
    const { value, done } = await reader.read();
    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
    const lines = buffer.split('\n');
    buffer = done ? '' : lines.pop();
    for (const line of lines) {
      if (!line.trim()) continue;
      const event = JSON.parse(line);
      if (event.type === 'progress') {
        progress.push(event.message);
        renderMappingProgress(progress);
      } else if (event.type === 'error') {
        throw new Error(event.message || `${progressLabel} failed`);
      } else if (event.type === 'result') {
        result = event;
      }
    }
    if (done) break;
  }
  if (!result) throw new Error(`${progressLabel} returned no result`);
  return result;
}

async function streamMaplAuthoring(prompt) {
  const response = await fetch(MAPL_STREAM_URL, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ prompt })
  });
  const result = await readMaplStream(response, 'MAPL generation');
  if (!result?.output) throw new Error('MAPL generation returned no source artifact');
  return result;
}

async function streamLastMapTest() {
  const response = await fetch(MAPL_TEST_STREAM_URL, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: '{}'
  });
  return readMaplStream(response, 'MAPL test');
}

async function readJsonResponse(response, operation) {
  const text = await response.text();
  let data = {};
  if (text.trim()) {
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(`${operation} returned an invalid response (${response.status})`);
    }
  }
  if (!response.ok) {
    throw new Error(data.error || `${operation} failed (${response.status})`);
  }
  if (!text.trim()) {
    throw new Error(`${operation} returned an empty response (${response.status})`);
  }
  return data;
}

/* ─────────────────────────────────────────────────────────
   SPEECH TO TEXT – Push-to-Talk
───────────────────────────────────────────────────────── */
let recognizer = null;
let sttReady   = true;
let sttActive  = false;

function initSTT() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    renderOutput('Speech recognition is not supported in this browser. Use Chrome or Edge over HTTPS.');
    setStatus('', 'speech unavailable');
    return false;
  }
  recognizer = new SR();
  recognizer.lang           = 'en-US';
  recognizer.interimResults = false;
  recognizer.continuous     = false;

  recognizer.onresult = (event) => {
    const text = event.results[0][0].transcript;
    document.getElementById('queryBox').value = text;
    sendQuery(text);
  };
  recognizer.onerror = (event) => {
    const messages = {
      'not-allowed': 'microphone permission denied',
      'service-not-allowed': 'speech service permission denied',
      'audio-capture': 'microphone unavailable',
      'network': 'speech recognition network error',
      'no-speech': 'no speech detected',
      'aborted': 'listening stopped'
    };
    const status = messages[event?.error] || `speech recognition error${event?.error ? `: ${event.error}` : ''}`;
    if (recognizer) recognizer.onend = null;
    finishSTT(status);
  };
  recognizer.onend   = () => finishSTT();
  return true;
}

function finishSTT(statusText = 'idle') {
  sttActive  = false;
  sttReady   = true;
  recognizer = null;
  document.getElementById('talkBtn').classList.remove('active');
  document.getElementById('talkBtn').textContent = '\u{1F3A4} Push to Talk';
  setStatus('', statusText);
}

function startSTT() {
  if (!sttReady || sttActive) return;
  if (!initSTT()) return;
  sttReady  = false;
  sttActive = true;
  document.getElementById('talkBtn').classList.add('active');
  document.getElementById('talkBtn').textContent = '\uD83D\uDD34 Listening\u2026';
  setStatus('listening', 'listening');
  try { recognizer.start(); } catch (e) { finishSTT(`could not start listening: ${e.message}`); }
}

function toggleSTT() {
  if (sttActive && recognizer) {
    setStatus('', 'stopping...');
    try { recognizer.stop(); } catch (e) { finishSTT(`could not stop listening: ${e.message}`); }
    return;
  }
  startSTT();
}

/* ─────────────────────────────────────────────────────────
   TEXT TO SPEECH
───────────────────────────────────────────────────────── */
function speak(text) {
  if (!window.speechSynthesis) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 1.0;
  speechSynthesis.speak(utter);
}

/* ─────────────────────────────────────────────────────────
   SEND QUERY
───────────────────────────────────────────────────────── */
async function sendQuery(text) {
  if (!text || !text.trim()) return;

  hideFeedbackBar();
  showSpinner('Thinking\u2026');
  setStatus('busy', 'sending\u2026');
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('fbGood').disabled  = false;
  document.getElementById('fbBad').disabled   = false;

  try {
    if (isMappingTestQuery(text)) {
      const tested = await streamLastMapTest();
      const output = typeof tested.output === 'string'
        ? tested.output
        : JSON.stringify(tested.output, null, 2);
      const outputLabel = tested.outputFormat === 'xml' ? 'CAMT.053 XML' : 'CAMT.053';
      renderOutput(`INPUT (SWIFT MT940)\n${tested.input}\n\nOUTPUT (${outputLabel})\n${output}`);
      setStatus('ok', `tested: ${tested.mapId}`);
      return;
    }

    if (isMappingAuthoringQuery(text)) {
      const generated = await streamMaplAuthoring(text);
      renderOutput(generated.output);
      setStatus('ok', generated.savedPath ? `saved: ${generated.savedPath}` : 'MAPL ready');
      return;
    }

    const files    = document.getElementById('uploadInput').files;
    const formData = new FormData();
    formData.append('message', text);
    for (let i = 0; i < files.length; i++) formData.append('files', files[i]);

    const actorUserId = localStorage.getItem('pulse.actorUserId') || 'system-admin';
    const res  = await fetch(MCP_QUERY_URL, {
      method: 'POST',
      headers: { 'x-user-id': actorUserId },
      body: formData
    });
    const data = await readJsonResponse(res, 'MCP request');

    const reply = data.output || JSON.stringify(data, null, 2);
    renderOutput(reply);
    if (data.voiceReply) speak(data.voiceReply);
    setStatus('ok', 'ok');

    // Show feedback bar for every real query (not reset)
    if (data._interactionId) {
      showFeedbackBar(data._interactionId, data._intentId, data._needsClarification === true);
    }
  } catch (err) {
    renderOutput('Error: ' + err.message);
    setStatus('', 'error');
  } finally {
    document.getElementById('sendBtn').disabled = false;
  }
}

/* ─────────────────────────────────────────────────────────
   RESET MODEL
───────────────────────────────────────────────────────── */
async function resetModel() {
  hideFeedbackBar();
  showSpinner('Resetting model\u2026');
  setStatus('busy', 'resetting\u2026');
  document.getElementById('resetBtn').disabled = true;

  try {
    const formData = new FormData();
    formData.append('message', '__RESET_MODEL__');
    const res  = await fetch(MCP_QUERY_URL, { method: 'POST', body: formData });
    const data = await readJsonResponse(res, 'Model reset');
    renderOutput(data.output || JSON.stringify(data, null, 2));
    setStatus('ok', 'reset ok');
  } catch (err) {
    renderOutput('Reset error: ' + err.message);
    setStatus('', 'error');
  } finally {
    document.getElementById('resetBtn').disabled = false;
  }
}

/* ─────────────────────────────────────────────────────────
   UI EVENTS
───────────────────────────────────────────────────────── */
document.getElementById('talkBtn').addEventListener('click', toggleSTT);
document.getElementById('sendBtn').addEventListener('click', () => sendQuery(document.getElementById('queryBox').value));
document.getElementById('resetBtn').addEventListener('click', resetModel);
document.getElementById('correctionsBtn').addEventListener('click', runCorrections);

document.getElementById('uploadInput').addEventListener('change', () => {
  const count = document.getElementById('uploadInput').files.length;
  document.getElementById('fileCount').textContent = count > 0 ? count + ' file' + (count > 1 ? 's' : '') : '';
});

document.getElementById('queryBox').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuery(document.getElementById('queryBox').value); }
});

refreshCorrectionStatus();
setInterval(refreshCorrectionStatus, 10000);
</script>
