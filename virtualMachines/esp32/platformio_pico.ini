[env:pico_w]
platform = raspberrypi
board = pico_w
framework = arduino
lib_deps =
	bblanchon/ArduinoJson
	# Add Pico-compatible web server and FS libraries here
board_build.filesystem = littlefs
build_flags = -std=gnu++17 -DENABLE_PMACHINE
lib_ignore = AsyncTCP, ESPAsyncTCP, AsyncTCP_RP2040W

# Note: You may need to add or adapt web server and WiFi libraries for Pico W compatibility.
# AsyncWebServer is not available for Pico W; use alternatives like WebServer or Pico specific libraries.
# WiFi support is available via Arduino-Pico core (WiFi.h).