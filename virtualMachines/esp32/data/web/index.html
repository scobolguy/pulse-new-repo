<!DOCTYPE html>
<html>
<head>
    <title>Set Node Name</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 1rem;
            background: #f5f7fb;
            color: #1a2538;
        }
        .card {
            max-width: 560px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            padding: 1rem;
        }
        h2 { margin-top: 0; font-size: 1.25rem; }
        .field { margin-bottom: 0.9rem; }
        label { display: block; margin-bottom: 0.35rem; font-size: 1rem; font-weight: 600; }
        input[type=text], input[type=password] {
            width: 100%;
            font-size: 1rem;
            padding: 0.65rem;
            border-radius: 8px;
            border: 1px solid #b9c7dc;
        }
        button {
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.7rem;
            border-radius: 8px;
            border: 1px solid #2f6fd3;
            background: #2f6fd3;
            color: #ffffff;
            cursor: pointer;
        }
        button:hover { background: #255db1; }
        #result { margin-top: 0.9rem; font-size: 0.95rem; }
        #qrcode { margin-top: 1rem; }
        #qrcode canvas { max-width: 100%; height: auto; }
        @media (max-width: 600px) {
            body { padding: 0.75rem; }
            .card { padding: 0.85rem; }
            h2 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Provision Device</h2>
        <form id="provisionForm">
            <div class="field">
                <label for="ssid">WiFi SSID:</label>
                <input type="text" id="ssid" name="ssid" required>
            </div>
            <div class="field">
                <label for="password">WiFi Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="field">
                <label for="nodeName">Node Name:</label>
                <input type="text" id="nodeName" name="nodeName" value="{{NODE_NAME}}" required>
            </div>
            <button type="submit">Provision</button>
        </form>
        <div id="result"></div>
        <div id="qrcode"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
    document.getElementById('provisionForm').onsubmit = async function(e) {
        e.preventDefault();
        const ssid = document.getElementById('ssid').value;
        const password = document.getElementById('password').value;
        const nodeName = document.getElementById('nodeName').value;
        const params = new URLSearchParams({ ssid, password, nodeName });
        const res = await fetch('/provision', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        });
        document.getElementById('result').innerText = await res.text();
    };
    // Optionally show a QR code for WiFi connection
    function showQRCode() {
        const ssid = document.getElementById('ssid').value;
        const password = document.getElementById('password').value;
        if (ssid && password) {
            const wifiString = `WIFI:T:WPA;S:${ssid};P:${password};;`;
            QRCode.toCanvas(document.getElementById('qrcode'), wifiString, { width: 200 }, function (error) {
                if (error) document.getElementById('qrcode').innerText = 'QR error';
            });
        }
    }
    document.getElementById('ssid').addEventListener('input', showQRCode);
    document.getElementById('password').addEventListener('input', showQRCode);
    </script>
</body>
</html>
